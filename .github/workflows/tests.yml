name: Tests

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests (PySpark + FastAPI)
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install Java (required for PySpark)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run ETL tests
        run: |
          python -m pytest src/tests/ -v --tb=short -k "test_etl or test_main" || true
      
      - name: Run API tests
        run: |
          python -m pytest src/tests/ -v --tb=short -k "test_api or test_endpoint"
      
      - name: Run all tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest src/tests/ -v --cov=src --cov-report=term-missing --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Build & Lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Check build output
        run: |
          if [ -d "frontend/dist" ]; then
            echo "✅ Frontend build successful"
            ls -la frontend/dist/
          else
            echo "❌ Build failed - no dist folder"
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build & Push
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: wine-api-backend:latest
      
      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: wine-dashboard-frontend:latest
      
      - name: Build ETL image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pyspark-etl:latest

  integration-test:
    runs-on: ubuntu-latest
    name: Docker Compose Integration Test
    needs: [backend-tests, frontend-tests, docker-build]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and start services
        run: |
          docker-compose build --no-cache
          docker-compose up -d
          sleep 15
      
      - name: Check backend health
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/30 - Backend not ready yet..."
            sleep 2
          done
          echo "❌ Backend health check failed"
          docker-compose logs backend
          exit 1
      
      - name: Test API endpoints
        run: |
          echo "Testing /health endpoint..."
          curl -s http://localhost:8000/health | jq .
          
          echo "Testing /stats/total-count endpoint..."
          curl -s http://localhost:8000/stats/total-count | jq .
          
          echo "Testing API documentation..."
          curl -s http://localhost:8000/docs > /dev/null && echo "✅ API docs available" || exit 1
      
      - name: Check frontend health
        run: |
          for i in {1..30}; do
            if curl -f http://localhost/ > /dev/null 2>&1; then
              echo "✅ Frontend is running"
              exit 0
            fi
            echo "Attempt $i/30 - Frontend not ready yet..."
            sleep 2
          done
          echo "❌ Frontend health check failed"
          docker-compose logs frontend
          exit 1
      
      - name: View service logs
        if: always()
        run: |
          echo "=== Backend Logs ==="
          docker-compose logs backend | tail -20
          echo "=== Frontend Logs ==="
          docker-compose logs frontend | tail -20
          echo "=== ETL Logs ==="
          docker-compose logs etl | tail -20
      
      - name: Cleanup
        if: always()
        run: docker-compose down -v

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort
      
      - name: Check code formatting with black
        run: black --check src/ || true
      
      - name: Check import sorting with isort
        run: isort --check-only src/ || true
      
      - name: Lint with flake8
        run: flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install security tools
        run: pip install bandit safety
      
      - name: Run security scan with bandit
        run: bandit -r src/ -f json -o bandit-report.json || true
      
      - name: Check dependencies with safety
        run: |
          pip install -r requirements.txt
          safety check --json || true

  summary:
    runs-on: ubuntu-latest
    name: Test Summary
    needs: [backend-tests, frontend-tests, docker-build, integration-test, code-quality, security-scan]
    if: always()
    
    steps:
      - name: Print test results
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║      Wine Reviews Platform - Tests     ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "✅ Backend Tests: ${{ needs.backend-tests.result }}"
          echo "✅ Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "✅ Docker Build: ${{ needs.docker-build.result }}"
          echo "✅ Integration Tests: ${{ needs.integration-test.result }}"
          echo "✅ Code Quality: ${{ needs.code-quality.result }}"
          echo "✅ Security Scan: ${{ needs.security-scan.result }}"
          echo ""
          echo "Overall: All tests completed!"
